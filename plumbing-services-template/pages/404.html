<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | FlowFix Plumbing</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#0f172a', 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
            secondary: { DEFAULT: '#0d9488', 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' },
            emergency: { DEFAULT: '#dc2626', 600: '#dc2626', 700: '#b91c1c' }
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

  <!-- Theme & RTL Toggles Floating Top Right -->
  <div class="fixed top-6 right-6 flex items-center gap-2">
    <button type="button" class="theme-toggle-btn p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shadow-md" aria-label="Toggle theme">
      <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-amber-400"></i>
      <i data-lucide="moon" class="w-5 h-5 block dark:hidden text-slate-600"></i>
    </button>
    <button type="button" class="rtl-toggle-btn p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shadow-md" aria-label="Toggle LTR/RTL layout direction" title="Toggle Layout Direction (LTR/RTL)">
      <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
    </button>
  </div>

  <div class="max-w-md w-full text-center space-y-6">
    <!-- Plumbing 404 Visual Icon -->
    <div class="w-24 h-24 rounded-3xl bg-teal-600/20 text-teal-600 dark:text-teal-400 border border-teal-500/30 flex items-center justify-center mx-auto shadow-2xl">
      <i data-lucide="pipette" class="w-12 h-12 animate-bounce"></i>
    </div>

    <div class="space-y-2">
      <span class="text-xs font-extrabold uppercase tracking-widest text-teal-600 dark:text-teal-400">Error 404</span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white">Looks like this pipe has sprung a leak!</h1>
      <p class="text-slate-600 dark:text-slate-400 text-sm">
        The page you are looking for has been moved, renamed, or temporarily turned off like a closed main water shutoff valve.
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 pt-4 justify-center">
      <a href="../index.html" class="px-5 py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-lg transition-all">
        Home 1 (Classic)
      </a>
      <a href="../index-2.html" class="px-5 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-lg transition-all">
        Home 2 (Premium VIP)
      </a>
      <a href="tel:8005550147" class="px-5 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm shadow-lg transition-all">
        Emergency Call
      </a>
    </div>

    <div class="pt-6 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
      <div class="flex items-center justify-center gap-1.5 font-medium">
        <span>Developed by</span>
        <span class="font-semibold text-slate-800 dark:text-slate-200">Abhivorn Technologies Pvt. Ltd.</span>
      </div>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
</body>
</html>
